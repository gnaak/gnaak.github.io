         공개 검색을 허용하려면 이 줄을 지운다. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- 파비콘. public/ 에 둔 파일은 빌드하면 루트로 그대로 복사된다. -->

    />

    <!-- 첫 화면 흰 번쩍임 방지.
         번들 CSS 가 도착하기 전에도 바탕색이 맞게 깔리도록 여기서 먼저 정한다.
         값은 src/index.css 의 --bg 와 같아야 한다. -->
    <style>
      html { background: #fafaf9; color-scheme: light; }
      html.dark { background: #181818; color-scheme: dark; }
    </style>

    <!-- React 가 붙기 전에 dark 클래스를 먼저 찍는다 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-fSgG_2_F.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BWSS1Q2H.css">

    <!-- 챗봇 위젯 — 이 포트폴리오로 학습시킨 챗베이스 봇이다.
         defer 라 본문 렌더를 막지 않고, 로드에 실패하면 아무것도 그리지 않고 조용히 빠진다.
